<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwoczflix - Nasze Filmy</title>

    <!-- Biblioteka do szyfrowania AES -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px;
        }

        .brand-logo {
            max-width: 450px;
            margin-bottom: 40px;
        }

        .netflix-base { font-family: 'Arial Black', 'Impact', sans-serif; font-size: 110px; font-weight: 900; fill: #E50914; }
        .logo-group { filter: drop-shadow(-4px 4px 6px rgba(0,0,0,0.9)) drop-shadow(4px 4px 3px rgba(0,0,0,0.7)); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .box {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            position: relative;
        }

        .box:hover {
            transform: scale(1.05);
            box-shadow: 0px 0px 15px rgba(229, 9, 20, 0.4);
        }

        .box img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
            transition: filter 0.8s ease;
        }

        .blurred-img {
            filter: blur(10px) brightness(0.7);
        }

        .title {
            padding: 12px;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            background-color: #1c1c1c;
        }

        /* Plakietka z datą premiery na środku okładki */
        .premiere-badge {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(229, 9, 20, 0.9);
            color: #fff;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        .player-wrapper {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 30px;
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            border: none;
            font-size: 35px;
            line-height: 1;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            padding: 5px 12px;
            border-radius: 50%;
            transition: transform 0.2s, color 0.2s;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0px 4px 10px rgba(0,0,0,0.8);
        }

        .close-btn:hover {
            color: #E50914;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- LOGO KWOCZFLIX -->
    <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 220" width="100%">
            <g class="logo-group" transform="translate(10, 150)">
                <path d="M 10,-105 L 42,-105 L 42,5 L 10,5 Z" fill="#B81D24" />
                <path d="M 40,-55 L 85,-105 L 125,-105 L 68,-45 Z" fill="#E50914" />
                <path d="M 52,-55 L 122,5 L 82,5 L 32,-40 Z" fill="#E50914" />
                <text x="130" y="0" class="netflix-base">WOCZFLIX</text>
            </g>
        </svg>
    </div>

    <!-- BIBLIOTEKA FILMÓW -->
    <div class="grid">
        
        <!-- FILM 1 (ZASZYFROWANY HASŁEM + ZAMAZANY) -->
        <div class="box" onclick="playEncrypted('1D5ncXalhkD7iIO8WH_kNj9idliZtJszK')">
            <img src="Bex3.jpeg" alt="Bex-3 Pogoń za złoczyńcą" class="blurred-img" id="img-locked">
            <div class="title" id="title-locked">🔒 Bex-3 Pogoń za złoczyńcą</div>
        </div>

        <!-- FILM 2 (NORMALNY) -->
        <div class="box" onclick="play('1iq7xbdT2RUEjKb8KOtHKV5wenG-_22Rf')">
            <img src="szajsowizja1.jpeg" alt="Szajsowizja I Odsłona">
            <div class="title">Szajsowizja: I Odsłona</div>
        </div>
        
        <!-- FILM 2 (NORMALNY) -->
        <div class="box" onclick="play('1KciebpVB6sq544UNXAGUqJhTwEgypSAw')">
            <img src="szjsowizja2.jpeg" alt="Szajsowizja II Odsłona">
            <div class="title">Szajsowizja: II Odsłona</div>
        </div>

        <!-- NOWY FILM: 1 Z 4 (PREMIERA 19 LISTOPADA 2026) -->
        <div class="box" onclick="playScheduled('15Z40ukEVPtDPotZqXhQuNTnorrAElLnR', '2026-11-19T00:00:00', this)">
            <img src="1 z 4.jpg" alt="1 z 4" class="blurred-img">
            <div class="premiere-badge">Premiera: 19 listopada</div>
            <div class="title">⏳ 1 z 4</div>
        </div>

    </div>

    <!-- ODTWARZACZ WIDEO -->
    <div class="player-wrapper" id="player">
        <button class="close-btn" onclick="closeVideo()">✕</button>
        <iframe id="video" src="" allow="autoplay" allowfullscreen></iframe>
    </div>

    <script>
        var player = document.getElementById('player');
        var video = document.getElementById('video');
        var unlockedId = null;

        // Automatyczne odblurowanie na starcie strony, jeśli 19 listopada już minął
        window.addEventListener('DOMContentLoaded', function() {
            var releaseDate = new Date('2026-11-19T00:00:00');
            if (new Date() >= releaseDate) {
                var scheduledBoxes = document.querySelectorAll('.premiere-badge');
                scheduledBoxes.forEach(function(badge) {
                    var box = badge.parentElement;
                    box.querySelector('img').classList.remove('blurred-img');
                    box.querySelector('.title').innerText = "1 z 4";
                    badge.style.display = 'none';
                });
            }
        });

        // Funkcja otwierająca film dopiero po wyznaczonej dacie
        function playScheduled(id, releaseDateStr, element) {
            var now = new Date();
            var releaseDate = new Date(releaseDateStr);

            if (now >= releaseDate) {
                // Odblokowanie wizualne (na wypadek otwarcia strony przed północą i kliknięcia po północy)
                var img = element.querySelector('img');
                var badge = element.querySelector('.premiere-badge');
                var title = element.querySelector('.title');

                if (img) img.classList.remove('blurred-img');
                if (badge) badge.style.display = 'none';
                if (title) title.innerText = "1 z 4";

                play(id);
            } else {
                alert("Premiera filmu „1 z 4” odbędzie się 19 listopada 2026 roku! Wróć w czwartek.");
            }
        }

        // Funkcja z hasłem i szyfrowaniem
        function playEncrypted(encryptedData) {
            if (unlockedId) {
                play(unlockedId);
                return;
            }

            var pass = prompt("Ten film jest zabezpieczony! Podaj hasło:");
            if (!pass) return;

            try {
                var bytes = CryptoJS.AES.decrypt(encryptedData, pass);
                var decryptedId = bytes.toString(CryptoJS.enc.Utf8);

                if (decryptedId && decryptedId.length > 5) {
                    unlockedId = decryptedId;

                    var img = document.getElementById('img-locked');
                    var title = document.getElementById('title-locked');
                    img.classList.remove('blurred-img');
                    title.innerText = "Szajsowizja: I Odsłona";

                    setTimeout(function() {
                        play(unlockedId);
                    }, 600);
                } else {
                    alert("Błędne hasło! Nie udało się odblokować filmu.");
                }
            } catch (e) {
                alert("Błędne hasło! Nie udało się odblokować filmu.");
            }
        }

        function play(id) {
            video.src = "https://drive.google.com/file/d/" + id + "/preview";
            player.style.display = "block";
            
            if (player.requestFullscreen) {
                player.requestFullscreen();
            } else if (player.webkitRequestFullscreen) {
                player.webkitRequestFullscreen();
            } else if (player.msRequestFullscreen) {
                player.msRequestFullscreen();
            }

            document.addEventListener('fullscreenchange', exitHandler);
            document.addEventListener('webkitfullscreenchange', exitHandler);
        }

        function closeVideo() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
            player.style.display = "none";
            video.src = "";
        }

        function exitHandler() {
            if (!document.fullscreenElement && !document.webkitIsFullScreen) {
                player.style.display = "none";
                video.src = "";
            }
        }
    </script>

</body>
</html>
